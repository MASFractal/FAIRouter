[project]
name = "fai-router"
version = "0.1.0"
description = "Выбор исполнителя под задачу, судья результата и обучение на отзывах"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fai_router*"]

# Профили задач по сериям рейтингов; тот же файл встроен ресурсом в сборку на C#
[tool.setuptools.package-data]
fai_router = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
