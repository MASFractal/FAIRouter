[project]
name = "fai-router"
version = "0.1.0"
description = "Выбор исполнителя под задачу среди LLM, судья результата и обучение на отзывах"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MASFractal" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
keywords = ["llm", "router", "routing", "openai", "openrouter", "fractalrouter", "judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/MASFractal/FAIRouter"
Repository = "https://github.com/MASFractal/FAIRouter"
Issues = "https://github.com/MASFractal/FAIRouter/issues"
FractalRouter = "https://fractalrouter.ru"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fai-router = "fai_router.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Забор внешних замеров (fai_router.sources) в пакет не входит: он живет вне репозитория,
# библиотеке нужен только готовый снимок
[tool.setuptools.packages.find]
include = ["fai_router*"]
exclude = ["fai_router.sources*"]

# Профили задач по сериям и снимок замеров: тот же файл профилей встроен ресурсом в сборку на C#
[tool.setuptools.package-data]
fai_router = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
