# Публикация пакета fai-router на PyPI по тегу вида py-v0.1.0. Ключ не нужен: PyPI доверяет
# этому репозиторию через trusted publishing, его надо один раз включить в настройках проекта
# на pypi.org (Publishing → GitHub: owner MASFractal, repo FAIRouter, workflow publish-python.yml,
# environment pypi).
name: publish-python

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: Python }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade build
      - run: python -m pip install -e ".[test]" && python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: Python/dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
