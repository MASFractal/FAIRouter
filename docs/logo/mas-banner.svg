<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img" aria-label="MAS: многоагентная система FractalAgents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#143C78"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40E0D0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#40E0D0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#40E0D0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#40E0D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- карточка -->
  <rect x="0.5" y="0.5" width="759" height="195" rx="18" fill="url(#bg)" stroke="#2A5BA8" stroke-opacity="0.6"/>
  <rect x="24" y="0.5" width="712" height="2" fill="url(#glow)"/>

  <!-- декор справа: сеть агентов -->
  <g opacity="0.22" stroke="#9CC8FF" stroke-width="1.5" fill="none">
    <path d="M600 40 L690 70 L640 130 Z"/>
    <path d="M690 70 L730 150"/>
    <path d="M640 130 L730 150"/>
    <path d="M600 40 L540 110 L640 130"/>
  </g>
  <g opacity="0.35" fill="#9CC8FF">
    <circle cx="600" cy="40" r="4"/><circle cx="690" cy="70" r="4"/><circle cx="640" cy="130" r="4"/>
    <circle cx="730" cy="150" r="4"/><circle cx="540" cy="110" r="4"/>
  </g>

  <!-- значок слева -->
  <circle cx="72" cy="98" r="54" fill="url(#halo)"/>
  <circle cx="72" cy="98" r="34" fill="#102A52" stroke="#40E0D0" stroke-width="2"/>
  <g transform="translate(54 80) scale(1.5)" fill="#40E0D0">
    <circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/>
    <path d="M11 7.5 6.5 15.2l1.3.8L12 9l4.2 7 1.3-.8L13 7.5zM8 18h8v1.6H8z"/>
  </g>

  <!-- текст -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="136" y="58" fill="#40E0D0" font-size="12" font-weight="700" letter-spacing="2.2">ОТ АВТОРОВ FAIROUTER</text>
    <text x="136" y="90" fill="#FFFFFF" font-size="25" font-weight="700">MAS: многоагентная система FractalAgents</text>
    <text x="136" y="121" fill="#D6E2F3" font-size="15">Команда ИИ-агентов берет задачу целиком: делит на шаги,</text>
    <text x="136" y="143" fill="#D6E2F3" font-size="15">подключает инструменты, собирает и проверяет результат.</text>
    <text x="136" y="169" fill="#9CC8FF" font-size="14" font-weight="600">Чат открыт для всех: без установки и настройки.</text>
  </g>
</svg>
